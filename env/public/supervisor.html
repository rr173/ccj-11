<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>异议超期升级与延期审批（主管）</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>异议超期升级与延期审批</h1>
        <p class="subtitle">逾期升级记录只读留痕；每份异议至多一次延期，由主管批准或拒绝</p>
      </div>
      <div class="top-actions">
        <span id="userName" class="user-box"></span>
        <button id="logoutBtn" class="button secondary" type="button">退出</button>
      </div>
    </header>

    <section id="loginView" class="card login-card">
      <h2>主管登录</h2>
      <p class="muted">演示主管账号：supervisor1，密码：password123</p>
      <form id="loginForm">
        <label>用户名<input name="username" autocomplete="username" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
        <div id="loginError" class="alert error hidden"></div>
        <button class="button primary" type="submit">登录</button>
      </form>
    </section>

    <section id="appView" class="app hidden">
      <div id="globalAlert" class="alert hidden"></div>
      <section class="card">
        <div class="receipt-head">
          <h2>逾期升级与通知留痕</h2>
          <div class="filter-bar">
            <label>类型
              <select id="kindFilter">
                <option value="">全部</option>
                <option value="overdue">逾期升级</option>
                <option value="extension-requested">延期申请待审批</option>
                <option value="extension-approved">延期已批准</option>
                <option value="extension-rejected">延期已拒绝</option>
                <option value="reminder">到期前提醒</option>
              </select>
            </label>
            <button id="refreshNotifsBtn" class="button secondary" type="button">刷新</button>
          </div>
        </div>
        <div id="notificationList" class="archive-list"></div>
      </section>

      <section class="card">
        <div class="receipt-head">
          <h2>延期审批</h2>
          <div class="filter-bar">
            <label>状态
              <select id="extensionFilter">
                <option value="pending">待审批</option>
                <option value="">全部</option>
                <option value="approved">已批准</option>
                <option value="rejected">已拒绝</option>
              </select>
            </label>
            <button id="refreshExtBtn" class="button secondary" type="button">刷新</button>
          </div>
        </div>
        <div id="extensionList" class="archive-list"></div>
      </section>
    </section>
  </main>
  <script type="module" src="/supervisor.js"></script>
</body>
</html>
