<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>服务端权威办理流程</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>网页办理流程</h1>
        <p class="subtitle">进度、草稿、确认、一次性令牌与电子回执均由服务端持久化</p>
      </div>
      <div class="top-actions">
        <a class="button secondary" href="/verify">回执核验（无需登录）</a>
        <div id="userBox" class="user-box hidden">
          <span id="userName"></span>
          <button id="logoutBtn" class="button secondary" type="button">退出</button>
        </div>
      </div>
    </header>

    <section id="loginView" class="card login-card">
      <h2>登录</h2>
      <p class="muted">演示账号：alice 或 bob，密码：password123</p>
      <form id="loginForm">
        <label>用户名<input name="username" autocomplete="username" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
        <div id="loginError" class="alert error hidden"></div>
        <button class="button primary" type="submit">登录并继续</button>
      </form>
    </section>

    <section id="appView" class="app hidden">
      <div class="side-col">
        <div class="progress-panel card">
          <h2>办理进度</h2>
          <ol id="stepList" class="step-list"></ol>
          <div class="server-state">
            <span>服务端版本：<b id="stateVersion"></b></span>
            <span>当前步骤：<b id="currentStepLabel"></b></span>
          </div>
        </div>
        <div class="records-panel card hidden" id="recordsPanel">
          <h2>回执版本时间线</h2>
          <ul id="recordsList" class="records-list"></ul>
          <p class="muted small">按办理顺序展示每份回执、更正中的草稿及其来源关系。回执内容固定保存；更正会产生新的办理记录与新回执，原回执不被覆盖。</p>
        </div>
      </div>

      <div class="work-panel">
        <div id="globalAlert" class="alert hidden"></div>
        <section id="correctionPanel" class="card hidden"></section>
        <form id="stepForm" class="card"></form>
        <section id="receiptPanel" class="card hidden"></section>
      </div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
